
name: Hello World CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Hello World Application
        run: python app.py

      - name: Run Automated Tests
        run: python -m unittest -v

      - name: Package Application
        run: |
          mkdir -p dist
          cp app.py test_app.py dist/
          cd dist
          zip ../hello-world.zip app.py test_app.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: hello-world-package
          path: hello-world.zip
